# JJBible — orchestration complète (MySQL + API NestJS + Front Angular/nginx)
#
# Arborescence attendue (à côté de ce fichier) :
#   jjbible/
#   ├── docker-compose.yml   (ce fichier)
#   ├── .env                 (copié depuis .env.example)
#   ├── jjbible_Back_Nest/   (le backend)
#   └── jjbible_Front/       (le frontend)
#
# Lancement :  docker compose up -d --build

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - db_data:/var/lib/mysql
    # Pas de `ports:` exposés -> la base n'est JAMAIS joignable de l'extérieur
    healthcheck:
      test:
        ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./jjbible_Back_Nest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE}
      DB_LOGGING: "false"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
    # Pas de `ports:` -> seul le frontend (nginx) parle au backend en interne

  frontend:
    build: ./jjbible_Front
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT}:80"

volumes:
  db_data:
